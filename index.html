<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Somali — learn the language, one form at a time</title>
    <meta
      name="description"
      content="A short, source-verified Somali course. Every form you are taught is cited to a published grammar."
    />
    <meta property="og:title" content="Somali" />
    <meta
      property="og:description"
      content="A short, source-verified Somali course. Every form you are taught is cited to a published grammar."
    />
    <meta property="og:image" content="./og-image.png" />

    <!-- Matches --surface in src/index.css, per mode, so the browser chrome
         does not flash the wrong color on load. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbf7f0" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#17140f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Somali" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Source Sans 3 for English, Source Serif 4 for Somali. Same superfamily,
         designed to pair. The serif is reserved for the target language — see
         the rule at the top of src/index.css. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap"
      rel="stylesheet"
    />

    <script>
      /* Apply the saved theme before first paint, or a light-mode flash hits
         every dark-mode learner on every load. Mirrors src/lib/theme.ts. */
      (function () {
        try {
          var t = localStorage.getItem('lg-theme');
          if (t === 'light' || t === 'dark') {
            document.documentElement.classList.add(t);
          }
        } catch (e) {
          /* private mode — fall through to prefers-color-scheme */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
