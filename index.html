<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Somali</title>
    <meta
      name="description"
      content="A short, source-verified Somali course. Every form you are taught is cited to a published grammar."
    />
    <meta property="og:title" content="Somali" />
    <meta
      property="og:description"
      content="A short, source-verified Somali course."
    />
    <meta property="og:image" content="./og-image.png" />

    <!-- System theme only — no toggle, no stored preference. These match --bg
         in src/index.css per mode so the browser chrome never flashes. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f2f2" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Somali" />
    <link rel="manifest" href="/manifest.json" />

    <!-- No webfont for the interface: SF Pro comes from the device on Apple
         hardware, and Apple does not license it for the web. Inter is the
         fallback everywhere else and is loaded only because of that. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
